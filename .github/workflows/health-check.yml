name: Health Check & Auto-Repair

on:
  schedule:
    # 每 10 分鐘檢查一次
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check page and assets status
        id: check
        run: |
          BASE="https://nashwu0117.github.io/gesture-synth-enhanced"
          PAGE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/")
          JS_REF=$(curl -s "$BASE/" | grep -o 'assets/[a-zA-Z0-9._-]*\.js' | head -1)
          echo "JS ref: $JS_REF"
          if [ -z "$JS_REF" ]; then
            echo "status=broken" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/$JS_REF")
          echo "page=$PAGE_CODE js=$JS_CODE"
          if [ "$PAGE_CODE" = "200" ] && [ "$JS_CODE" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=broken" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        if: steps.health-check.outputs.status == 'broken'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.health-check.outputs.status == 'broken'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.health-check.outputs.status == 'broken'
        run: npm ci

      - name: Build
        if: steps.health-check.outputs.status == 'broken'
        run: npm run build

      - name: Republish to gh-pages branch
        if: steps.health-check.outputs.status == 'broken'
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages-site gh-pages
          cd /tmp/gh-pages-site
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          # 清除工作區檔案（保留 .git 指標，否則 git 無法運作）
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -r $GITHUB_WORKSPACE/dist/index.html .
          cp -r $GITHUB_WORKSPACE/dist/assets .
          git add -A
          git commit -m "Auto-repair: redeploy after failed health check" || echo "No changes to commit"
          git push origin gh-pages
          echo "Repair deployed."