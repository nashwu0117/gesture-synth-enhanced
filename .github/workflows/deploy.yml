name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          # 清除舊的部署檔案（保留 assets 資料夾由下面重建）
          git rm -rf --ignore-unmatch assets index.html
          # 複製新 build（只用 dist 目錄，避免舊 index.html 殘留）
          cp -r dist/index.html dist/assets .
          git add -f index.html assets
          git commit -m "Deploy: automated build from main ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages