name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 用獨立目錄做部署，避免與 node_modules 的交換檔衝突
          git fetch --depth=1 origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages-site gh-pages
          cd /tmp/gh-pages-site
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          # 清除所有檔案後置入新 build
          rm -rf -- ./* ./.[!.]* 2>/dev/null || true
          cp -r /home/runner/work/gesture-synth-enhanced/gesture-synth-enhanced/dist/index.html .
          cp -r /home/runner/work/gesture-synth-enhanced/gesture-synth-enhanced/dist/assets .
          git add -A
          git commit -m "Deploy: automated build from main ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
          cd /home/runner/work/gesture-synth-enhanced/gesture-synth-enhanced
          git worktree remove --force gh-pages